<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Invoice Sheet with Folded Corner -->
  <g filter="url(#shadow)">
    <!-- Main Sheet -->
    <path d="M16 11 C14.343 11 13 12.343 13 14 V48 C13 49.657 14.343 51 16 51 H37 L47 41 V14 C47 12.343 45.657 11 44 11 H16 Z" fill="#FFFFFF" />
    
    <!-- Invoice Fold / Notch detail at top right -->
    <path d="M41 11 H44 C45.657 11 47 12.343 47 14 V17 L41 11 Z" fill="#E0E7FF" opacity="0.6"/>

    <!-- Subtle receipt lines -->
    <rect x="33" y="18" width="8" height="2" rx="1" fill="#CBD5E1" />
    <rect x="33" y="23" width="8" height="2" rx="1" fill="#CBD5E1" />
    <rect x="33" y="28" width="6" height="2" rx="1" fill="#CBD5E1" />

    <!-- Rupee (₹) Symbol on Invoice -->
    <!-- Top bar -->
    <path d="M19 18 H30" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <!-- Second bar -->
    <path d="M19 23 H28" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <!-- Loop -->
    <path d="M22.5 18 C28.5 18 28.5 28 22.5 28 H19" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slanted leg -->
    <path d="M22 28 L28.5 37" stroke="#4F46E5" stroke-width="2.6" stroke-linecap="round" />

    <!-- Mini invoice total divider & small bar -->
    <path d="M18 41 H31" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" />
    <rect x="18" y="44" width="10" height="2" rx="1" fill="#10B981" />
  </g>

  <!-- Stock Package / Inventory Box (3D Isometric) Overlapping Bottom-Right -->
  <g filter="url(#shadow)">
    <!-- Box Base Glow/Backing circle for contrast -->
    <circle cx="45" cy="43" r="13" fill="#312E81" opacity="0.4" />

    <!-- Top face -->
    <path d="M45 32 L54 36.5 L45 41 L36 36.5 Z" fill="url(#boxTop)" />
    <!-- Left face -->
    <path d="M36 36.5 L45 41 V51 L36 46.5 Z" fill="url(#boxLeft)" />
    <!-- Right face -->
    <path d="M45 41 L54 36.5 V46.5 L45 51 Z" fill="url(#boxRight)" />
    <!-- Package tape stripe -->
    <path d="M42 33.5 L51 38 M45 41 V51" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
    <!-- Stock Checkmark Badge -->
    <circle cx="51" cy="33" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M49.5 33 L50.7 34.2 L52.8 31.8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

