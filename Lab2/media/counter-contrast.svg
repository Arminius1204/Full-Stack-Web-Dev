<rect x="730" y="340" width="56" height="190" fill="#fff"/><text x="758" y="565">SOAP</text>
<rect x="810" y="490" width="56" height="40" fill="#ffe14d"/><text x="838" y="565" fill="#ffe14d">BUTTER ⚠</text>
<rect x="890" y="380" width="56" height="150" fill="#fff"/><text x="918" y="565">LED</text>
<rect x="970" y="510" width="56" height="20" fill="#ffe14d"/><text x="998" y="565" fill="#ffe14d">SALT ⚠</text>
</g>
</g>
</svg>
